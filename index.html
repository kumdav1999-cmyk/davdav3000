<!doctype html>
<html lang="ru">
<head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тангочо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F1;--card:#FAFBF9;--ink:#1C2333;--muted:#5F6B73;--grid:#B7C6BE;
  --shu:#C23A2B;--ok:#3F7D5A;--sel:#1C2333;--on-sel:#F2F4F1;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#13171D;--card:#1A2028;--ink:#E4E8EC;--muted:#97A2AB;--grid:#33424A;
    --shu:#E25B4C;--ok:#6DB38C;--sel:#E4E8EC;--on-sel:#13171D;
  }
}
:root[data-theme="dark"]{
  --paper:#13171D;--card:#1A2028;--ink:#E4E8EC;--muted:#97A2AB;--grid:#33424A;
  --shu:#E25B4C;--ok:#6DB38C;--sel:#E4E8EC;--on-sel:#13171D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.jp{font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif}
ruby{ruby-position:over}
rt{font-size:.42em;color:var(--muted);font-family:"Noto Serif JP",serif;letter-spacing:.02em}
main{max-width:560px;margin:0 auto;padding:20px 16px 130px}
[hidden]{display:none!important}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:1.45rem;margin:0;font-weight:600;letter-spacing:-.01em}
h1 .jp{margin-right:.3em}
h2{font-size:1rem;font-weight:600;margin:26px 0 10px}
.link{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--grid);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.tabs button{border:0;background:none;color:var(--ink);font:inherit;font-size:.85rem;font-weight:500;padding:8px 4px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.tabs button .jp{font-size:1.2rem;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--sel);color:var(--on-sel)}
.seg{display:inline-flex;border:1px solid var(--grid);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--ink);font:inherit;font-size:.9rem;padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--on-sel)}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--grid);border-left:1px solid var(--grid);margin:14px 0 8px}
.cell{aspect-ratio:1;border:0;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);background:var(--card);color:var(--ink);font:inherit;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.cell .n{font-family:"Noto Serif JP",serif;font-size:1.35rem;line-height:1}
.cell .c{font-size:.7rem;color:var(--muted);margin-top:5px}
.cell .best{position:absolute;left:0;bottom:0;height:3px;background:var(--ok)}
.cell.empty{cursor:default}
.cell.empty .n{color:var(--muted);opacity:.45}
.cell[aria-pressed="true"]{background:var(--sel);color:var(--on-sel)}
.cell[aria-pressed="true"] .c{color:inherit;opacity:.75}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}
.lenrow{margin-top:14px;padding:4px 2px}
#gate{padding-top:30px}
#gate h1{margin-bottom:18px}
#gate p{font-size:1.05rem;line-height:1.6}
.seg .pc{display:inline-block;min-width:1.4em;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--shu);color:#fff;font-size:.75rem;line-height:1.5;text-align:center}
.hint .warn{color:var(--shu);font-weight:500}
.hint .link{font-size:inherit;padding:0 2px}
.fp h3{font-size:.88rem;font-weight:500;color:var(--muted);margin:14px 0 6px}
.fp .chips{display:flex;flex-wrap:wrap;gap:6px}
.fp .chip{font-size:.85rem;padding:5px 10px}
.fp .chip small{margin-left:5px;opacity:.6;font-size:.75em}
.fp .chip[aria-pressed="true"]{background:var(--sel);color:var(--on-sel);border-color:var(--sel)}
.fp-acts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px}
.prompt .form{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;background:var(--sel);color:var(--on-sel);font-size:.95rem}
.modes{display:grid;gap:8px}
.mode{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--grid);background:var(--card);color:var(--ink);font:inherit;padding:12px 14px;border-radius:10px;cursor:pointer}
.mode .ico{font-family:"Noto Serif JP",serif;font-size:1.1rem;width:3.2em;flex:none;text-align:center;white-space:nowrap}
.mode b{display:block;font-weight:600}
.mode .d{color:var(--muted);font-size:.88rem}
.mode[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:1px solid var(--grid);background:var(--card);color:var(--ink);font:inherit;padding:12px 14px;border-radius:10px;cursor:pointer;margin-top:8px;text-align:left}
.switch .d{display:block;color:var(--muted);font-size:.88rem}
.knob{flex:none;width:44px;height:26px;border-radius:999px;background:var(--grid);position:relative;transition:background .15s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:transform .15s}
[aria-pressed="true"] .knob{background:var(--ok)}
[aria-pressed="true"] .knob::after{transform:translateX(18px)}
.chip{border:1px solid var(--grid);background:var(--card);color:var(--muted);font:inherit;font-size:.85rem;padding:4px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ok);color:var(--ink)}
.chip .jp{font-size:.9rem}
.dock{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--paper) 35%)}
.dock .in{max-width:560px;margin:0 auto}
.btn{width:100%;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font:inherit;font-weight:600;padding:14px;cursor:pointer;font-size:1rem}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--grid);font-weight:500}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.qtop .right{display:flex;align-items:center;gap:10px}
.strip{display:flex;flex-wrap:wrap;border-top:1px solid var(--grid);border-left:1px solid var(--grid)}
.strip i{width:18px;height:18px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);background:var(--card)}
.strip i.ok{background:var(--ok)}
.strip i.bad{background:var(--shu)}
.strip i.cur{box-shadow:inset 0 0 0 2px var(--ink)}
.pbar{display:flex;height:8px;border-radius:999px;background:var(--grid);overflow:hidden}
.pbar b{background:var(--ok)}
.pbar s{background:var(--shu)}
.prompt{text-align:center;padding:30px 8px 24px}
.prompt .big{font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.5;word-break:break-word}
.prompt .kan{font-size:clamp(4.5rem,24vw,6.5rem);line-height:1.2}
.prompt .ru{font-size:1.45rem;font-weight:500;line-height:1.35}
.prompt .q{color:var(--muted);font-size:.88rem;margin-top:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--grid);background:var(--card);color:var(--ink);font:inherit;padding:14px;border-radius:10px;cursor:pointer}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.bad{border-color:var(--shu);background:color-mix(in srgb,var(--shu) 14%,var(--card))}
input.ans{width:100%;font:inherit;font-size:1.15rem;padding:14px;border:1px solid var(--grid);border-radius:10px;background:var(--card);color:var(--ink)}
.kana-prev{min-height:1.8em;font-size:1.6rem;text-align:center;margin-top:10px}
.under{text-align:center}
.fb{margin-top:14px;padding:12px 14px;border-left:3px solid;background:var(--card);border-radius:0 10px 10px 0}
.fb.ok{border-color:var(--ok)}
.fb.bad{border-color:var(--shu)}
.fb .jp{font-size:1.3rem}
.fb .rd{display:block;color:var(--muted);font-size:.92rem;margin-top:2px}
.sent{font-size:clamp(1.45rem,6.5vw,1.9rem);line-height:2.2}
.blank{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--ink);margin:0 .15em;line-height:1.4;text-align:center}
.blank.ok{color:var(--ok);border-color:var(--ok)}
.blank.bad{color:var(--shu);border-color:var(--shu)}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two .opt{text-align:center;font-family:"Noto Serif JP",serif;font-size:1.3rem;padding:12px 8px}
.line{min-height:66px;border-bottom:2px solid var(--grid);display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;align-items:flex-end;justify-content:center}
.line:empty::before{content:"Нажимайте на слова снизу";color:var(--muted);font:.9rem "Golos Text",system-ui,sans-serif;align-self:center}
.line.ok{border-color:var(--ok)}
.line.bad{border-color:var(--shu)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.tile{border:1px solid var(--grid);background:var(--card);color:var(--ink);font:inherit;font-family:"Noto Serif JP",serif;font-size:1.25rem;line-height:2;padding:0 12px;border-radius:8px;cursor:pointer}
.line .tile{border-color:var(--ink)}
.line.ok .tile{border-color:var(--ok)}
.line.bad .tile{border-color:var(--shu)}
.tile:disabled{cursor:default}
.tile.ghost{color:transparent;border-style:dashed;background:none;cursor:default}
.tile.ghost rt{color:transparent}
.fb .ex{display:block;color:var(--muted);font-size:.92rem;margin-top:4px}
.fb .jp{line-height:2}
#fb{scroll-margin-bottom:120px}
.rule{display:block;margin-top:10px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--shu) 10%,transparent);font-size:.95rem;line-height:1.5}
.rule b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--shu);margin-bottom:2px}
.fb.ok .rule{background:color-mix(in srgb,var(--ok) 10%,transparent)}
.fb.ok .rule b{color:var(--ok)}
.stamp{width:150px;height:150px;margin:20px auto 14px;border:4px solid var(--shu);border-radius:50%;color:var(--shu);display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-weight:600;transform:rotate(-8deg);animation:stamp .35s ease-out}
@keyframes stamp{from{transform:scale(1.6) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}.knob,.knob::after{transition:none}}
.score{text-align:center;font-size:1.1rem;margin:0}
.miss{list-style:none;padding:0;margin:0;border-top:1px solid var(--grid)}
.miss li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--grid)}
.miss .jp{font-size:1.2rem;line-height:1.7;flex:none;max-width:60%}
.miss .r{color:var(--muted);text-align:right;font-size:.95rem}
.miss li.col{flex-direction:column;align-items:flex-start;gap:2px}
.miss li.col .r{text-align:left}
.stack{display:grid;gap:8px;margin-top:18px}
textarea{width:100%;min-height:200px;font:inherit;font-size:.95rem;padding:12px;border:1px solid var(--grid);border-radius:10px;background:var(--card);color:var(--ink);resize:vertical}
.fmt{background:var(--card);border:1px solid var(--grid);border-radius:10px;padding:12px 14px;font-size:.92rem;overflow-x:auto}
.fmt code{font-family:"Noto Serif JP",serif;white-space:pre}
.msg{min-height:1.5em;color:var(--ok);margin:10px 0 0}
.msg.err{color:var(--shu)}
</style>
</head>
<body>
<main>
  <!-- Замок -->
  <section id="gate" hidden>
    <h1><span class="jp">単語帳</span>Тангочо</h1>
    <p id="gateText"></p>
    <div class="stack" id="gateBtns"></div>
  </section>
  <!-- Главная -->
  <section id="home">
    <header class="top">
      <h1><span class="jp">単語帳</span>Тангочо</h1>
      <button class="link" id="toLists">Мои списки</button>
    </header>
    <div class="tabs" role="group" aria-label="Что учим">
      <button data-kind="w" aria-pressed="true"><span class="jp">言葉</span>Слова</button>
      <button data-kind="k" aria-pressed="false"><span class="jp">漢字</span>Кандзи</button>
      <button data-kind="g" aria-pressed="false"><span class="jp">文法</span>Грамматика</button>
    </div>
    <div class="bar-row">
      <div class="seg" role="group" aria-label="Часть учебника">
        <button data-part="1" aria-pressed="true">Уроки 1–25</button>
        <button data-part="2" aria-pressed="false">26–50</button>
      </div>
      <button class="link" id="selAll">Выбрать все</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="hint" id="selInfo"></p>

    <h2>Режим</h2>
    <div class="modes" id="modes"></div>
    <div class="fp" id="formPick" hidden></div>
    <button class="switch" id="furiSwitch" aria-pressed="true">
      <span><b>Фуригана над кандзи</b><span class="d">Чтение мелко над словом</span></span><span class="knob"></span>
    </button>
    <div class="bar-row lenrow">
      <span>Вопросов в тесте</span>
      <div class="seg" role="group" aria-label="Вопросов в тесте">
        <button data-len="10" aria-pressed="false">10</button>
        <button data-len="20" aria-pressed="true">20</button>
        <button data-len="0" aria-pressed="false">Все</button>
      </div>
    </div>
  </section>

  <!-- Тест -->
  <section id="quiz" hidden>
    <div class="qtop">
      <button class="link" id="quit">Выйти</button>
      <span class="right">
        <button class="chip" id="furiChip" aria-pressed="true"><span class="jp">ふりがな</span></button>
        <span id="qcount"></span>
      </span>
    </div>
    <div class="strip" id="strip" aria-hidden="true"></div>
    <div class="prompt" id="prompt"></div>
    <div id="answer"></div>
    <div id="fb" aria-live="polite"></div>
  </section>

  <!-- Итог -->
  <section id="result" hidden>
    <div class="stamp jp" id="stamp"></div>
    <p class="score" id="score"></p>
    <div id="missWrap"></div>
    <div class="stack" id="resBtns"></div>
  </section>

  <!-- Списки -->
  <section id="lists" hidden>
    <header class="top">
      <h1>Мои списки</h1>
      <button class="link" id="backHome">К урокам</button>
    </header>
    <div class="tabs" role="group" aria-label="Какой список">
      <button data-lkind="w" aria-pressed="true"><span class="jp">言葉</span>Слова</button>
      <button data-lkind="k" aria-pressed="false"><span class="jp">漢字</span>Кандзи</button>
      <button data-lkind="g" aria-pressed="false"><span class="jp">文法</span>Грамматика</button>
    </div>
    <p class="hint">Все 50 уроков уже встроены. Здесь можно добавить свои слова, кандзи или задания — они появятся в тех же уроках.</p>
    <p id="fmtText"></p>
    <div class="fmt"><code id="fmtCode"></code></div>
    <h2>Вставить</h2>
    <textarea id="imp" spellcheck="false"></textarea>
    <div class="stack">
      <button class="btn" id="addBtn">Добавить</button>
    </div>
    <p class="msg" id="impMsg" aria-live="polite"></p>
    <h2>Сейчас в базе</h2>
    <p class="hint" id="listStats"></p>
    <div class="stack"><button class="btn ghost" id="clearBtn">Удалить мои добавления</button></div>
  </section>
</main>

<div class="dock" id="dock"><div class="in"><button class="btn" id="dockBtn">Начать</button></div></div>

<script>
const BASE_W = `1;わたし;;я

2;ボールペン;;шариковая ручка
2;シャープペンシル;;автоматический карандаш

function toKana(src){
  const s=src.toLowerCase();let out='',i=0;
  while(i<s.length){
    const c=s[i],nx=s[i+1];
    if(!/[a-z'\-]/.test(c)){out+=c;i++;continue}
    if(c==='n'){
      if(nx==="'"){out+='ん';i+=2;continue}
      if(nx==='n'){const n2=s[i+2];out+='ん';i+=(n2===undefined||!/[aiueo]/.test(n2))?2:1;continue}
      if(nx===undefined){out+='n';i++;continue}
      if(!/[aiueoy]/.test(nx)){out+='ん';i++;continue}
    }
    if(c===nx&&/[bcdfghjkmpqrstvwxz]/.test(c)){out+='っ';i++;continue}
    if(c==='t'&&nx==='c'&&s[i+2]==='h'){out+='っ';i++;continue}
    let hit=false;
    for(let L=4;L>=1;L--){const p=s.substr(i,L);if(R[p]){out+=R[p];i+=L;hit=true;break}}
    if(!hit){out+=c;i++}

}

function smartRuby(kanji,kana){

  if(/[、\/]/.test(kanji+kana)) return whole();
  const tj=kanji.split(' '),tk=kana.split(' ');
  if(tj.length!==tk.length) return whole();
  return tj.map((j,i)=>{
    const k=tk[i]; if(j===k) return esc(j);
    let a=0; while(a<j.length&&a<k.length&&j[a]===k[a]&&isKana(j[a])) a++;
    let b=0; while(b<j.length-a&&b<k.length-a&&j[j.length-1-b]===k[k.length-1-b]&&isKana(j[j.length-1-b])) b++;
    const mid=j.slice(a,j.length-b),midK=k.slice(a,k.length-b);

  }).join(' ');
}

function verbInfo(w){

  if(!/ます$/.test(lk)||lk.length<3) return null;

  if(lk==='きます'&&lj==='来ます') g='k';

  else if(/します$/.test(lk)&&(lk==='します'||S_KANA[lk]||/[ァ-ヴー]/.test(lk)||/[\u4e00-\u9fff]{2}します$/.test(lj))) g='s';

    return [0,{te:'て',nai:'ない',dict:'る',ta:'た',nakatta:'なかった',tara:'たら',pot:'られる',vol:'よう',imp:'ろ',proh:'るな',ba:'れば',pass:'られる',caus:'させる'}[f]];
  }
  if(g==='s'){
    return [1,{te:'して',nai:'しない',dict:'する',ta:'した',nakatta:'しなかった',tara:'したら',pot:'できる',vol:'しよう',imp:'しろ',proh:'するな',ba:'すれば',pass:'される',caus:'させる'}[f]];
  }
  if(g==='k'){
    return [1,{te:'きて',nai:'こない',dict:'くる',ta:'きた',nakatta:'こなかった',tara:'きたら',pot:'こられる',vol:'こよう',imp:'こい',proh:'くるな',ba:'くれば',pass:'こられる',caus:'こさせる'}[f]];
  }
  // I группа
  const r=ROW[c], u=r[2];
  const iku=vi.base==='いきます';
  const aru=vi.base==='あります';
  const teT={'う':'って','つ':'って','る':'って','む':'んで','ぶ':'んで','ぬ':'んで','く':'いて','ぐ':'いで','す':'して'}[u];
  const te=iku?'って':teT, ta=te.replace(/て$/,'た').replace(/で$/,'だ');
  const nai=aru?null:r[0]+'ない';
  const m={te,ta,tara:ta+'ら',dict:u,nai:aru?'':nai,nakatta:aru?'':r[0]+'なかった',pot:r[3]+'る',vol:r[4]+'う',imp:r[3],proh:u+'な',ba:r[3]+'ば',pass:r[0]+'れる',caus:r[0]+'せる'}[f];
  if(aru&&(f==='nai'||f==='nakatta')) return ['all',f==='nai'?'ない':'なかった'];
  return [1,m];
}
function verbForm(w,f){
  const vi=verbInfo(w); if(!vi) return null;
  if(['pot','pass','caus','imp','vol','proh'].includes(f)&&NOFORMS[vi.base]) return null;
  const [drop,add]=verbEnding(vi,f);
  let kana, kanji='';
  if(drop==='all'){kana=vi.pk+add; if(vi.jstem) kanji=vi.pj+add;}
  else{
    kana=vi.pk+vi.stem.slice(0,vi.stem.length-drop)+add;
    if(vi.jstem){
      if(drop===0) kanji=vi.pj+vi.jstem+add;
      else if(vi.g==='k') kanji=vi.pj+vi.jstem+add.slice(1);   // 来 + ない
      else if(vi.jstem.slice(-1)===vi.stem.slice(-1)) kanji=vi.pj+vi.jstem.slice(0,-1)+add;
    }
  }
  return {kana,kanji};
}

  let k=w.k==='いい/よい'?'いい':w.k;

  const [pk,lk]=splitLast(k);
  let j=(w.j||'').split('、')[0],pj='',lj='';
  if(j){[pj,lj]=splitLast(j); if((pk==='')!==(pj==='')){pj='';lj=''}}

  if(I_ADJ.has(lk)&&(!lj||/い$/.test(lj))) return {t:'i',pk,lk,pj,lj};

}
const A_END={
  i:{aneg:['くないです','くありません'],apast:['かったです'],apastneg:['くなかったです','くありませんでした'],ate:['くて'],aadv:['く'],

  na:{aneg:['じゃありません','ではありません','じゃないです','ではないです'],apast:['でした'],apastneg:['じゃありませんでした','ではありませんでした','じゃなかったです','ではなかったです'],

  const all=ends.map(e=>ai.pk+stemK+e);

const RU_STOP=new Set('чем-то кого-то что-то какой-то который которая которое которые этот этого этом такой также тоже очень много можно нужно когда-то где-то куда-то вежл скромн почтит разг кого-л что-л чего-л чему-л кому-л'.split(' '));
const ruTokens=r=>new Set(r.toLowerCase().replace(/\([^)]*\)/g,' ').split(/[^а-яёa-z\-]+/).map(t=>t.replace(/^-+|-+$/g,'')).filter(t=>t.length>=4&&!RU_STOP.has(t)).map(t=>t.slice(0,Math.max(4,t.length-2))));
const tooClose=(a,b)=>{if(a===b)return true;const A=ruTokens(a),B=ruTokens(b);for(const t of A)if(B.has(t))return true;return false};
const bigr=s=>{s=norm(s);const o=[];for(let i=0;i<s.length-1;i++)o.push(s.slice(i,i+2));return o.length?o:[s]};
const dice=(a,b)=>{const A=bigr(a),B=bigr(b);let m=0;const used=B.slice();A.forEach(x=>{const i=used.indexOf(x);if(i>=0){m++;used.splice(i,1)}});return 2*m/(A.length+B.length)};
function wType(w){
  if(/ます$/.test(w.k)) return 'v';
  if(/\(な\)/.test(w.r)) return 'an';
  const a=adjInfo(w); if(a) return a.t==='i'?'ai':'an';
  if(/[0-9０-９～〜]/.test(w.k+w.j)||/^(なん|いく)/.test(w.k)&&w.k.length<=5) return 'num';
  if(/\s/.test(w.k.trim())||/(ね|か|よ|です|ません|ください|ございます|。|？|！)$/.test(w.k)||/[…!?]/.test(w.r)) return 'phr';
  return 'n';
}
const ruPos=r=>{const t=(r.toLowerCase().replace(/\([^)]*\)/g,' ').match(/[а-яё\-]+/)||[''])[0];
  return /(ть|ться|чь|чься)$/.test(t)?'v':/(ый|ий|ой|ая|ое|ые|ий)$/.test(t)?'a':/(но|ро|ко|до|ше|же|ее|ьно|о)$/.test(t)&&t.length>3?'d':'n'};
const kanjiSet=s=>new Set((s||'').match(/[一-鿿]/g)||[]);
function similarWords(x,inSel){
  const tx=wType(x),px=ruPos(x.r),kx=kanjiSet(x.j),seen=new Set([x.r]),out=[];
  DATA.w.forEach(y=>{
    if(y===x||seen.has(y.r)||norm(y.k)===norm(x.k)||tooClose(x.r,y.r)) return;
    let s=0;const d=Math.abs(y.l-x.l);
    s+=wType(y)===tx?4:-3;
    if(ruPos(y.r)===px) s+=1.5;
    s+=d===0?3:d<=1?2.5:d<=3?1.5:d<=6?.5:0;
    s+=dice(x.k,y.k)*5;
    if(norm(x.k)[0]===norm(y.k)[0]) s+=1.5;
    if(Math.abs(norm(x.k).length-norm(y.k).length)<=1) s+=1;
    for(const c of kanjiSet(y.j)) if(kx.has(c)){s+=2.5;break}
    if(inSel(y.l)) s+=1;
    s+=Math.random()*2;
    out.push([s,y]);
  });
  out.sort((a,b)=>b[0]-a[0]);
  const res=[];
  for(const [,y] of out){ if(res.some(r=>r===y.r||tooClose(r,y.r))) continue; res.push(y.r); seen.add(y.r); if(res.length===3) break; }
  return res;
}
const onSet=k=>new Set((k.on||'').split(/[、,，\s]+/).map(r=>r.replace(/^-+|-+$/g,'')).filter(Boolean).map(norm));
function similarKanji(x,inSel){
  const ox=onSet(x),out=[];
  DATA.k.forEach(y=>{
    if(y===x||y.c===x.c||tooClose(x.m,y.m)) return;
    let s=0;const d=Math.abs(y.l-x.l);
    s+=d===0?3:d<=1?2.5:d<=3?1.5:d<=6?.5:0;
    for(const r of onSet(y)) if(ox.has(r)){s+=2.5;break}
    const kx=(x.kun||'').split(/[、,，\s.]+/)[0],ky=(y.kun||'').split(/[、,，\s.]+/)[0];
    if(kx&&ky&&norm(kx)[0]===norm(ky)[0]) s+=1;
    if(inSel(y.l)) s+=1;
    s+=Math.random()*2;
    out.push([s,y]);
  });
  out.sort((a,b)=>b[0]-a[0]);
  const res=[];
  for(const [,y] of out){ if(res.some(r=>r===y.m||tooClose(r,y.m))) continue; res.push(y.m); if(res.length===3) break; }
  return res;
}
function choiceOptions(x,correct){
  const inSel=l=>Q.lessons.has(l);
  let others=Q.kind==='w'?similarWords(x,inSel):similarKanji(x,inSel);
  if(others.length<3){ // запасной путь: случайные
    const get=Q.kind==='w'?(v=>v.r):(v=>v.m);
    others=[...new Set(others.concat(shuffle(DATA[Q.kind].map(get))))].filter(v=>v!==correct).slice(0,3);
  }
  return shuffle(others.concat(correct));
}

    setDock(null);
  }else if(Q.mode==='gfill'){
    Q.opts=shuffle(shuffle(x.wrong).slice(0,3).concat(x.a));
    a.innerHTML=`<div class="opts two">${Q.opts.map(o=>`<button class="opt">${rb(o)}</button>`).join('')}</div>`;
    a.querySelectorAll('.opt').forEach((b,i)=>b.onclick=()=>{
      if(Q.done)return;
      const ok=Q.opts[i]===x.a;
      a.querySelectorAll('.opt').forEach((el,j)=>{el.disabled=true;if(Q.opts[j]===x.a)el.classList.add('ok')});
      if(!ok)b.classList.add('bad');
      mark(ok);
    });
    setDock(null);
  }else if(Q.mode==='gorder'){
    let t=x.parts;
    for(let k=0;k<12&&t.join('|')===x.parts.join('|');k++) t=shuffle(x.parts);
    Q.tiles=t;Q.line=[];
    renderTiles();
  }else{
    a.innerHTML=`<input class="ans" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${Q.mode==='conj'?'ромадзи, кана или кандзи':'ромадзи или кана'}" aria-label="Ответ">
      <div class="kana-prev jp" id="prev" aria-hidden="true"></div>
      <div class="under"><button class="link" id="dunno">Не знаю</button></div>`;
    const inp=$('#ans');
    inp.oninput=()=>{$('#prev').textContent=toKana(inp.value)};
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();Q.done?next():check()}};
    $('#dunno').onclick=()=>{if(!Q.done)mark(false)};
    setTimeout(()=>inp.focus(),30);
    setDock('Проверить',check);
  }
}
function check(){
  if(Q.done)return;
  const x=Q.list[Q.idx],inp=$('#ans');
  if(!inp.value.trim()){inp.focus();return}
  const a=norm(finalize(inp.value));
  let ok;
  if(Q.mode==='write') ok=x.k.split('/').some(v=>norm(v)===a);
  else if(Q.mode==='conj') ok=x.alts.concat(x.kanji?[x.kanji]:[]).some(v=>norm(v)===a||norm(v)===norm(inp.value));
  else ok=readings(x).some(r=>norm(r)===a||norm(r.split('.')[0])===a);
  $('#prev').textContent=finalize(inp.value);
  mark(ok);
}
function kanjiInfo(x){
  return `<span class="jp">${esc(x.c)}</span> — ${esc(x.m)}<span class="rd">он: ${esc(x.on||'—')}; кун: ${esc(x.kun||'—')}</span>`;
}
function conjInfo(x){
  const alt=x.alts.length>1?`<span class="rd">Тоже верно: ${x.alts.slice(1).map(esc).join(', ')}</span>`:'';
  return `<span class="jp">${pairHTML(x.kana,x.kanji,true)}</span><span class="rd">${esc(x.f.n)}</span>${alt}${ruleBox(conjRule(x))}`;
}
const ruleBox=t=>t?`<span class="rule"><b>Правило</b>${esc(t)}</span>`:'';
function grammarInfo(x){
  return `<span class="jp">${rb(full(x),true)}</span>${x.r?`<span class="rd">${esc(x.r)}</span>`:''}${ruleBox(x.e)}`;
}
const GRP={1:'I группа',2:'II группа',s:'III группа (する)',k:'III группа (来る)'};
function conjRule(x){
  const f=x.f.id;
  if(x.kd==='a'){
    const t=adjInfo(x.w).t, ii=t==='i', good=/^(いい|よい)/.test(x.w.k.split(' ').pop()||'')||x.w.k==='いい/よい';
    const R=ii?{aneg:'い → くないです (или くありません)',apast:'い → かったです',apastneg:'い → くなかったです (или くありませんでした)',ate:'い → くて',aadv:'い → く',
      aplainneg:'い → くない',aplainpast:'い → かった',aplainpastneg:'い → くなかった',aba:'い → ければ'}
      :{aneg:'+ じゃ ありません (じゃ ないです)',apast:'+ でした',apastneg:'+ じゃ ありませんでした (じゃ なかったです)',ate:'+ で',aadv:'+ に',
      aplainneg:'+ じゃ ない',aplainpast:'+ だった',aplainpastneg:'+ じゃ なかった',aba:'+ なら'};
    return (ii?'い-прилагательное: ':'な-прилагательное: ')+R[f]+(ii&&good?'. いい спрягается от よい: よくない, よかった.':'.');
  }
  const vi=verbInfo(x.w); if(!vi) return '';
  const g=vi.g, gn=GRP[g];
  const MAS={masu:'ます',masen:'ません',mashita:'ました',masendeshita:'ませんでした'};
  if(MAS[f]){
    if(g===1){const r=ROW[vi.stem.slice(-1)];return `${gn}: в словарной форме «${r[2]}» → «${r[1]}» + ${MAS[f]}.`}
    if(g===2) return `${gn}: る → ${MAS[f]}.`;
    return g==='s'?`${gn}: する → し${MAS[f]}.`:`${gn}: 来る(くる) → 来(き)${MAS[f]}.`;
  }
  if(g===2){
    const E={te:'て',nai:'ない',dict:'る',ta:'た',nakatta:'なかった',tara:'たら',pot:'られる',vol:'よう',imp:'ろ',proh:'る + な',ba:'れば',pass:'られる',caus:'させる'};
    return `${gn}: ます → ${E[f]}.`;
  }
  if(g==='s'||g==='k'){
    const S={te:'して',nai:'しない',dict:'する',ta:'した',nakatta:'しなかった',tara:'したら',pot:'できる',vol:'しよう',imp:'しろ',proh:'するな',ba:'すれば',pass:'される',caus:'させる'};
    const K={te:'きて',nai:'こない',dict:'くる',ta:'きた',nakatta:'こなかった',tara:'きたら',pot:'こられる',vol:'こよう',imp:'こい',proh:'くるな',ba:'くれば',pass:'こられる',caus:'こさせる'};
    return g==='s'?`${gn} — особый глагол: します → ${S[f]}.`:`${gn} — особый глагол: きます → ${K[f]}.`;
  }
  const c=vi.stem.slice(-1), r=ROW[c], u=r[2];
  const TE={'う':['って','った'],'つ':['って','った'],'る':['って','った'],'む':['んで','んだ'],'ぶ':['んで','んだ'],'ぬ':['んで','んだ'],'く':['いて','いた'],'ぐ':['いで','いだ'],'す':['して','した']}[u];
  const iku=vi.base==='いきます', aru=vi.base==='あります';
  const te=iku?['って','った']:TE;
  const pre=`${gn}, основа на «${c}»: `;
  const R={
    te:`${c} → ${te[0]}`+(iku?' (行きます — исключение: 行って)':` (${({'って':'い・ち・り → って','んで':'み・び・に → んで','いて':'き → いて','いで':'ぎ → いで','して':'し → して'})[TE[0]]})`),
    ta:`${c} → ${te[1]} (как て-форма, только た/だ)`+(iku?'; 行きます → 行った':''),
    tara:`た-форма + ら: ${c} → ${te[1]}ら`,
    nai:aru?'あります → ない (исключение)':`${c} → ${r[0]} + ない`+(c==='い'?' (い → わ!)':''),
    nakatta:aru?'あります → なかった (исключение)':`${c} → ${r[0]} + なかった`+(c==='い'?' (い → わ!)':''),
    dict:`${c} → ${u}`,
    pot:`${c} → ${r[3]} + る`,
    vol:`${c} → ${r[4]} + う`,
    imp:`${c} → ${r[3]}`,
    proh:`словарная форма (${c} → ${u}) + な`,
    ba:`${c} → ${r[3]} + ば`,
    pass:`${c} → ${r[0]} + れる`+(c==='い'?' (い → わ!)':''),
    caus:`${c} → ${r[0]} + せる`+(c==='い'?' (い → わ!)':'')
  };
  return pre+R[f]+'.';
}
function renderTiles(){
  const a=$('#answer'),dis=Q.done?' disabled':'',lc=Q.done?(Q.res[Q.idx]?' ok':' bad'):'';
  a.innerHTML=`<div class="line${lc}">${Q.line.map(i=>`<button class="tile" data-i="${i}"${dis}>${rb(Q.tiles[i])}</button>`).join('')}</div>`+
    `<div class="bank">${Q.tiles.map((t,i)=>Q.line.includes(i)?`<span class="tile ghost" aria-hidden="true">${rb(t)}</span>`:`<button class="tile" data-i="${i}"${dis}>${rb(t)}</button>`).join('')}</div>`;
  if(Q.done) return;
  a.querySelectorAll('.line .tile').forEach(b=>b.onclick=()=>{Q.line=Q.line.filter(i=>i!==+b.dataset.i);renderTiles()});
  a.querySelectorAll('.bank button').forEach(b=>b.onclick=()=>{
    Q.line.push(+b.dataset.i);renderTiles();
    const f=a.querySelector('.bank button')||$('#dockBtn');f.focus({preventScroll:true});
  });
  setDock('Проверить',checkOrder,Q.line.length!==Q.tiles.length);
}
function checkOrder(){
  if(Q.done||Q.line.length!==Q.tiles.length)return;
  mark(Q.line.map(i=>Q.tiles[i]).join('')===Q.list[Q.idx].parts.join(''));
}
function refreshJP(){
  renderPrompt();
  if(Q.mode==='gorder') renderTiles();
  if(Q.mode==='gfill') document.querySelectorAll('#answer .opt').forEach((b,i)=>b.innerHTML=rb(Q.opts[i]));
}
function mark(ok){
  if(TG&&TG.HapticFeedback){try{TG.HapticFeedback.notificationOccurred(ok?'success':'error')}catch(e){}}
  Q.done=true;Q.res[Q.idx]=ok;renderStrip();
  const x=Q.list[Q.idx];
  if(Q.mode==='gfill') renderPrompt();
  if(Q.mode==='gorder') renderTiles();
  const body=Q.mode==='conj' ? conjInfo(x) : Q.kind==='k' ? kanjiInfo(x) : Q.kind==='g' ? grammarInfo(x) : `<span class="jp">${wordHTML(x,true)}</span> — ${esc(x.r)}`;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'Верно':'Правильно'}: ${body}</div>`;
  if(!ok) setTimeout(()=>{try{$('#fb').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){}},60);
  const inp=$('#ans'); if(inp) inp.readOnly=true;
  setDock(Q.idx+1<Q.list.length?'Дальше':'Итог',next);
  if(inp) inp.focus(); else $('#dockBtn').focus();
}
function next(){
  if(!Q.done)return;
  if(Q.idx+1<Q.list.length){Q.idx++;renderQ()}else finish();
}
$('#quit').onclick=()=>{Q=null;show('home');renderHome()};

/* ---------- итог ---------- */
function finish(){
  const total=Q.list.length,right=Q.res.filter(Boolean).length,pct=Math.round(right/total*100);
  const per={},best=BEST[Q.kind];
  Q.list.forEach((x,i)=>{per[x.l]=per[x.l]||[0,0];per[x.l][1]++;if(Q.res[i])per[x.l][0]++});
  Object.entries(per).forEach(([l,[r,t]])=>{const v=Math.round(r/t*100);if(best[l]==null||v>best[l])best[l]=v});
  save(KEYS[Q.kind][1],best);
  $('#stamp').textContent=pct>=80?'合格':'復習';
  $('#stamp').setAttribute('aria-label',pct>=80?'Сдано':'Нужно повторить');
  $('#score').textContent=`${right} из ${total} (${pct}%)`;
  const wrong=Q.list.filter((_,i)=>!Q.res[i]);
  const row=x=>x.t==='conj'
    ? `<li class="col"><span class="jp">${(b=>pairHTML(b.kana,b.kanji,true))(conjBase(x))} → ${pairHTML(x.kana,x.kanji,true)}</span><span class="r">${esc(x.f.n)}</span></li>`
    : Q.kind==='g'
    ? `<li class="col"><span class="jp">${rb(full(x),true)}</span><span class="r">${esc(x.r)}</span></li>`
    : Q.kind==='k'
    ? `<li><span class="jp">${esc(x.c)}</span><span class="r">${esc(x.m)}<br>${esc([x.on,x.kun].filter(Boolean).join('、'))}</span></li>`
    : `<li><span class="jp">${wordHTML(x,true)}</span><span class="r">${esc(x.r)}</span></li>`;
  $('#missWrap').innerHTML=wrong.length?`<h2>Ошибки</h2><ul class="miss">${wrong.map(row).join('')}</ul>`:'';
  const rb=$('#resBtns');rb.innerHTML='';
  const qk=Q.kind,qm=Q.mode,qlist=Q.list;
  const restart=list=>{kind=qk;MODE[qk]=qm;startQuiz(shuffle(list))};
  if(wrong.length){const b=document.createElement('button');b.className='btn';b.textContent='Повторить ошибки';b.onclick=()=>restart(wrong);rb.appendChild(b)}
  const again=document.createElement('button');again.className='btn ghost';again.textContent='Пройти заново';again.onclick=()=>restart(qlist);rb.appendChild(again);
  show('result');
  setDock('К урокам',()=>{Q=null;show('home');renderHome()});
}

/* ---------- мои списки ---------- */
let lkind='w';
const FMT={
  w:{text:'Одно слово на строку, поля через точку с запятой или Tab. Кандзи можно оставить пустым.',
     code:'урок;кана;кандзи;перевод\n4;おきます;起きます;вставать\n4;いま;今;сейчас',ph:'5;いきます;行きます;идти, ехать'},
  k:{text:'Один иероглиф на строку. Онъёми катаканой, кунъёми хираганой, несколько чтений через 「、」. Окуригану можно отделить точкой.',
     code:'урок;кандзи;онъёми;кунъёми;значение\n4;今;コン、キン;いま;сейчас\n4;起;キ;お.きる;вставать',ph:'5;行;コウ、ギョウ;い.く;идти'},
  g:{text:'Два вида заданий. Пропуск: предложение со знаком ＿, правильный ответ, неверные варианты через 「、」, перевод и пояснение. Сборка: слова через | в правильном порядке и перевод. Фуригану пишите в скобках сразу после кандзи: 学生[がくせい].',
     code:'урок;предложение с ＿;ответ;неверные;перевод;пояснение\n4;銀行[ぎんこう]は 9時[じ]＿ 3時[じ]までです。;から;まで、に、の;Банк работает с 9 до 3.;から — «с», まで — «до».\n\nурок;слова через |;перевод\n4;わたし|は|毎朝[まいあさ]|6時[じ]|に|起[お]きます;Я встаю в 6 утра.',
     ph:'5;わたし＿ 京都[きょうと]へ 行[い]きます。;は;を、に、で;Я поеду в Киото.'}
};
function renderLists(){
  document.querySelectorAll('[data-lkind]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lkind===lkind));
  $('#fmtText').textContent=FMT[lkind].text;
  $('#fmtCode').textContent=FMT[lkind].code;
  $('#imp').placeholder=FMT[lkind].ph;
  const nb=BASE[lkind].length,ne=EXTRA[lkind].length;
  $('#listStats').textContent=`Из учебника: ${countText(lkind,nb)}. Добавлено вами: ${ne?countText(lkind,ne):'ничего'}.`;
  $('#clearBtn').hidden=!ne;
}
function doImport(){
  const {items,bad}=PARSE[lkind]($('#imp').value),m=$('#impMsg');
  if(!items.length){m.className='msg err';m.textContent='Не нашёл ни одной строки в нужном формате.';return}
  const key=x=>x.l+'|'+(lkind==='w'?x.k+'|'+x.j:lkind==='k'?x.c:(x.s||x.parts.join('|')));
  const seen=new Set(DATA[lkind].map(key));
  items.forEach(x=>{if(!seen.has(key(x))){EXTRA[lkind].push(x);seen.add(key(x))}});
  save(KEYS[lkind][0],EXTRA[lkind]);rebuild(lkind);
  m.className=bad.length?'msg err':'msg';
  m.textContent=`Готово: ${items.length} ${plural(items.length,'строка','строки','строк')}`+(bad.length?`. Пропущены строки ${bad.join(', ')}: проверьте номер урока и поля.`:'.');
  $('#imp').value='';renderLists();
}
document.querySelectorAll('[data-lkind]').forEach(b=>b.onclick=()=>{lkind=b.dataset.lkind;$('#impMsg').textContent='';renderLists()});
$('#toLists').onclick=()=>{lkind=kind;show('lists');setDock(null);$('#impMsg').textContent='';renderLists()};
$('#backHome').onclick=()=>{show('home');renderHome()};
$('#addBtn').onclick=doImport;
$('#clearBtn').onclick=()=>{
  if(!confirm('Удалить всё, что вы добавили в этот раздел? Слова из учебника останутся.'))return;
  EXTRA[lkind]=[];save(KEYS[lkind][0],[]);rebuild(lkind);
  renderLists();$('#impMsg').className='msg';$('#impMsg').textContent='Ваши добавления удалены.';
};

function applyCloud(vals){
  let changed=false;
  const parse=v=>{try{return JSON.parse(v)}catch(e){return undefined}};
  ['w','k','g'].forEach(kd=>{
    const c=vals['tg_best_'+kd]&&parse(vals['tg_best_'+kd]);
    if(c&&typeof c==='object'){Object.entries(c).forEach(([l,v])=>{if(BEST[kd][l]==null||v>BEST[kd][l]){BEST[kd][l]=v;changed=true}});}
    const x=vals['tg_x_'+kd]&&parse(vals['tg_x_'+kd]);
    if(Array.isArray(x)&&x.length){EXTRA[kd]=x;rebuild(kd);changed=true}
  });
  if(vals.tg_furi!=null){const v=parse(vals.tg_furi);if(typeof v==='boolean'){furi=v;changed=true}}
  if(vals.tg_len!=null){const v=parse(vals.tg_len);if(typeof v==='number'){qlen=v;changed=true}}
  if(vals.tg_forms){const v=parse(vals.tg_forms);if(Array.isArray(v)){FSEL=new Set(v);changed=true}}
  // сохранить локально и отправить в облако объединённый прогресс
  ['w','k','g'].forEach(kd=>{try{localStorage.setItem('tg_best_'+kd,JSON.stringify(BEST[kd]))}catch(e){} cloudSet('tg_best_'+kd,JSON.stringify(BEST[kd]))});
  return changed;
}
function gate(text,btns){
  ['home','quiz','result','lists'].forEach(s=>$('#'+s).hidden=true);
  setDock(null);
  $('#gate').hidden=false;$('#gateText').innerHTML=text;
  const g=$('#gateBtns');g.innerHTML='';
  (btns||[]).forEach(([t,fn,ghost])=>{const b=document.createElement('button');b.className='btn'+(ghost?' ghost':'');b.textContent=t;b.onclick=fn;g.appendChild(b)});
}
function startApp(){
  $('#gate').hidden=true;
  setFuri(furi);show('home');renderHome();
  cloudPull(vals=>{ if(applyCloud(vals)){setFuri(furi);if(!$('#home').hidden) renderHome();} });
}
(function boot(){
  if(TG){
    try{TG.ready();TG.expand();if(TG.disableVerticalSwipes)TG.disableVerticalSwipes();}catch(e){}
    try{document.documentElement.setAttribute('data-theme',TG.colorScheme==='dark'?'dark':'light')}catch(e){}
    try{const bg=getComputedStyle(document.body).backgroundColor;TG.setHeaderColor&&TG.setHeaderColor(bg);TG.setBackgroundColor&&TG.setBackgroundColor(bg)}catch(e){}
    try{TG.BackButton.onClick(()=>{ if(!$('#quiz').hidden){Q=null} show('home');renderHome(); })}catch(e){}
  }
  if(!TG_UID){
    gate('Это приложение открывается только через Telegram-бота. Откройте его кнопкой в чате с ботом.');
    return;
  }
  if(ALLOWED_IDS.length&&!ALLOWED_IDS.includes(TG_UID)){
    gate(`Доступ закрыт.<br><span class="hint">Ваш Telegram ID: ${TG_UID}</span>`);
    return;
  }
  if(!ALLOWED_IDS.length){
    gate(`Режим настройки: доступ пока открыт всем, кто откроет бота.<br><br>Ваш Telegram ID: <b class="jp" id="myId">${TG_UID}</b><br><span class="hint">Пришлите этот номер Claude — он закроет доступ для всех, кроме вас.</span>`,
      [['Скопировать ID',()=>{try{navigator.clipboard.writeText(String(TG_UID))}catch(e){} $('#gateBtns .btn').textContent='Скопировано'}],['Продолжить',startApp,true]]);
    return;
  }
  startApp();
})();
</script>
